<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Free Fire Style Battle Royale</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #050508; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }

        /* Free Fire Lobby Overlay */
        #lobbyUI {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; z-index: 10;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);
        }

        /* Top Header */
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .profile-card {
            display: flex; align-items: center; gap: 12px;
            background: rgba(0, 0, 0, 0.65); padding: 8px 18px;
            border-radius: 30px; border: 1.5px solid #ffb703;
        }
        .currencies { display: flex; gap: 20px; font-weight: bold; font-size: 18px; }
        .currency-item { background: rgba(0, 0, 0, 0.6); padding: 6px 14px; border-radius: 20px; border: 1px solid #444; }

        /* Left Side Menu */
        .side-menu { display: flex; flex-direction: column; gap: 12px; width: 160px; }
        .menu-btn {
            background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
            border: 1px solid #00f0ff; color: #fff; padding: 10px 15px; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s;
        }
        .menu-btn:hover { background: #00f0ff; color: #000; }

        /* Bottom Right Match Controls */
        .match-section { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
        .mode-selector {
            background: rgba(20, 20, 30, 0.9); border: 2px solid #ff4500;
            padding: 10px 20px; border-radius: 8px; color: #ffa500; font-weight: bold; cursor: pointer;
        }
        .start-btn {
            background: linear-gradient(45deg, #ff8c00, #ff0000); border: none;
            color: #fff; font-size: 26px; font-weight: 900; padding: 16px 60px;
            border-radius: 12px; cursor: pointer; box-shadow: 0 0 25px rgba(255, 69, 0, 0.8);
            letter-spacing: 2px;
        }
        .start-btn:active { transform: scale(0.96); }

        /* Matchmaking & Countdown Popup */
        #matchModal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95); border: 2px solid #00f0ff;
            padding: 30px 50px; border-radius: 15px; text-align: center;
            display: none; z-index: 20; box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }
        #matchModal h2 { color: #00f0ff; margin-bottom: 15px; }
        .count-num { font-size: 48px; color: #ffb703; font-weight: bold; margin-top: 10px; }

        /* Mobile Controls */
        #controlsUI {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 40px;
            z-index: 10; pointer-events: none;
        }
        .ctrl-btn {
            width: 70px; height: 70px; background: rgba(255, 255, 255, 0.2);
            border: 2px solid #00f0ff; border-radius: 50%; color: #fff;
            font-size: 26px; display: flex; align-items: center; justify-content: center;
            pointer-events: auto; cursor: pointer;
        }
        #btnFire { background: rgba(255, 0, 0, 0.4); border-color: #ff0000; width: 85px; height: 85px; }

        /* In-Game HUD */
        #gameHUD {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: none; justify-content: space-between; font-weight: bold; font-size: 18px; z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 1. Free Fire Style Lobby UI -->
    <div id="lobbyUI">
        <div class="top-bar">
            <div class="profile-card">
                <span style="font-size:28px;">😎</span>
                <div>
                    <div style="font-size:16px; font-weight:bold;">উইনস্টন চার্চিল</div>
                    <div style="font-size:12px; color:#ffb703;">Lv. 61 | Heroic 🛡️</div>
                </div>
            </div>
            <div class="currencies">
                <div class="currency-item">🪙 46,292</div>
                <div class="currency-item">💎 1,250</div>
            </div>
        </div>

        <div class="side-menu">
            <button class="menu-btn" onclick="alert('স্টোর ওপেন হয়েছে!')">🛒 স্টোর</button>
            <button class="menu-btn" onclick="alert('লাক রয়্যাল ওপেন হয়েছে!')">🎰 লাক রয়্যাল</button>
            <button class="menu-btn" onclick="alert('বুইয়া পাস ওপেন হয়েছে!')">🎟️ বুইয়া পাস</button>
            <button class="menu-btn" onclick="alert('ইভেন্ট ওপেন হয়েছে!')">🎁 ইভেন্ট</button>
        </div>

        <div class="match-section">
            <div class="mode-selector" id="modeBtn" onclick="toggleMode()">মোড: BR-Ranked (Bermuda)</div>
            <button class="start-btn" onclick="startMatchmaking()">START</button>
        </div>
    </div>

    <!-- Matchmaking Modal (50 Players + 5 Sec Countdown) -->
    <div id="matchModal">
        <h2 id="matchStatus">প্লেয়ার খোঁজা হচ্ছে...</h2>
        <p style="color:#aaa;">কানেক্টেড প্লেয়ার: <span id="playerCount" style="color:#00ffcc; font-weight:bold;">1</span> / 50</p>
        <div class="count-num" id="countdownText">--</div>
    </div>

    <!-- In-Game HUD -->
    <div id="gameHUD">
        <div style="background:rgba(0,0,0,0.6); padding:8px 15px; border-radius:8px; border:1px solid #00f0ff;">
            জীবিত: <span id="aliveCount" style="color:#00ffcc;">50</span> / 50
        </div>
        <div style="background:rgba(0,0,0,0.6); padding:8px 15px; border-radius:8px; border:1px solid #ff0000;">
            স্বাস্থ্য: <span id="healthVal" style="color:#ff3333;">100</span> HP
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="controlsUI">
        <div style="display:flex; gap:15px;">
            <div class="ctrl-btn" id="btnLeft">◀</div>
            <div class="ctrl-btn" id="btnRight">▶</div>
        </div>
        <div class="ctrl-btn" id="btnFire">🔥</div>
    </div>

    <!-- Three.js 3D Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let selectedMode = "BR-Ranked";
        let scene, camera, renderer;
        let playerMesh, gunMesh;
        let enemies = [], bullets = [];
        let isGameRunning = false;
        let keys = {};

        function toggleMode() {
            selectedMode = selectedMode === "BR-Ranked" ? "CS-Ranked (Clash Squad)" : "BR-Ranked";
            document.getElementById("modeBtn").innerText = "মোড: " + selectedMode;
        }

        // Matchmaking Logic (50 Players Join + 5 Sec Delay)
        function startMatchmaking() {
            const modal = document.getElementById("matchModal");
            const pCount = document.getElementById("playerCount");
            const statusText = document.getElementById("matchStatus");
            const countText = document.getElementById("countdownText");

            modal.style.display = "block";
            let connected = 1;

            // Simulated 50 players joining rapidly
            let joinInterval = setInterval(() => {
                connected += Math.floor(Math.random() * 5) + 3;
                if (connected >= 50) {
                    connected = 50;
                    clearInterval(joinInterval);
                    
                    statusText.innerText = "ম্যাচ তৈরি! শুরু হচ্ছে...";
                    pCount.innerText = "50";

                    // 5 Seconds Countdown
                    let secondsLeft = 5;
                    countText.innerText = secondsLeft;

                    let timer = setInterval(() => {
                        secondsLeft--;
                        if (secondsLeft > 0) {
                            countText.innerText = secondsLeft;
                        } else {
                            clearInterval(timer);
                            modal.style.display = "none";
                            launch3DGame();
                        }
                    }, 1000);
                } else {
                    pCount.innerText = connected;
                }
            }, 100);
        }

        // Launching 3D Battle Arena
        function launch3DGame() {
            document.getElementById("lobbyUI").style.display = "none";
            document.getElementById("gameHUD").style.display = "flex";
            document.getElementById("controlsUI").style.display = "flex";

            init3DWorld();
            isGameRunning = true;
            animate3D();
        }

        function init3DWorld() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 14);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(20, 40, 20);
            light.castShadow = true;
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // Ground Arena
            const groundGeo = new THREE.PlaneGeometry(150, 150);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 3D Player Character
            const playerGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            playerGroup.add(body);

            // Gun in Hand
            const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 1.5);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            gunMesh = new THREE.Mesh(gunGeo, gunMat);
            gunMesh.position.set(0.7, 1.2, -0.6); // Placed in right hand
            playerGroup.add(gunMesh);

            playerMesh = playerGroup;
            scene.add(playerMesh);

            // Spawn 49 3D Bot Enemies in Field
            for (let i = 0; i < 49; i++) {
                const enemyGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
                const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
                const enemy = new THREE.Mesh(enemyGeo, enemyMat);

                enemy.position.set(
                    (Math.random() - 0.5) * 120,
                    1,
                    (Math.random() - 0.5) * 120
                );
                enemy.castShadow = true;
                scene.add(enemy);
                enemies.push(enemy);
            }

            // Controls listeners
            window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
            window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
            
            // Touch Buttons Controls
            document.getElementById("btnLeft").addEventListener("click", () => { playerMesh.position.x -= 1.5; });
            document.getElementById("btnRight").addEventListener("click", () => { playerMesh.position.x += 1.5; });
            document.getElementById("btnFire").addEventListener("click", fireBullet);
            window.addEventListener("click", fireBullet);
        }

        function fireBullet() {
            if (!isGameRunning) return;

            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            bullet.position.set(playerMesh.position.x + 0.7, 1.2, playerMesh.position.y - 0.6);
            bullet.velocity = new THREE.Vector3(0, 0, -1.2);
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        function update3D() {
            if (!isGameRunning) return;

            // Player Movement (PC Controls)
            const speed = 0.25;
            if (keys["w"] || keys["arrowup"]) playerMesh.position.z -= speed;
            if (keys["s"] || keys["arrowdown"]) playerMesh.position.z += speed;
            if (keys["a"] || keys["arrowleft"]) playerMesh.position.x -= speed;
            if (keys["d"] || keys["arrowright"]) playerMesh.position.x += speed;

            // Third-person Camera Follow
            camera.position.x = playerMesh.position.x;
            camera.position.z = playerMesh.position.z + 14;
            camera.lookAt(playerMesh.position);

            // Update Bullets
            bullets.forEach((b, bIdx) => {
                b.position.add(b.velocity);

                // Hit Detection with Enemies
                enemies.forEach((e, eIdx) => {
                    if (b.position.distanceTo(e.position) < 1.5) {
                        scene.remove(e);
                        enemies.splice(eIdx, 1);
                        scene.remove(b);
                        bullets.splice(bIdx, 1);

                        document.getElementById("aliveCount").innerText = enemies.length + 1;
                    }
                });

                if (b.position.z < -100) {
                    scene.remove(b);
                    bullets.splice(bIdx, 1);
                }
            });
        }

        function animate3D() {
            if (isGameRunning) {
                requestAnimationFrame(animate3D);
                update3D();
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
